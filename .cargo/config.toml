# ort(ONNX Runtime) 정적 링크 시 CRT 충돌 방지
# bge-m3-onnx-rust 의존성이 /MD(동적 CRT)를 요구하므로 통일
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=-crt-static"]

# Windows MSVC 빌드 시 CRT 통일을 위해 셸/CI에서 직접 설정해야 한다:
#   set CFLAGS=/MD
#   set CXXFLAGS=/MD
# Cargo의 [env]는 모든 타겟에 적용되어 Linux/macOS 빌드(cc/gcc)를 깨므로
# 글로벌로 두지 않는다.
